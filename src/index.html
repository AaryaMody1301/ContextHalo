<!doctype html>
<html>
    <head>
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
        />
        <title>ContextHalo</title>
        <style>
            :root {
                --bg-app: #0a0a0a;
                --bg-surface: #111111;
                --bg-elevated: #191919;
                --bg-hover: #1f1f1f;
                --text-primary: #f5f5f5;
                --text-secondary: #999999;
                --text-muted: #555555;
                --border: #222222;
                --border-strong: #333333;
                --accent: #3b82f6;
                --accent-hover: #2563eb;
                --success: #22c55e;
                --warning: #d4a017;
                --danger: #ef4444;
                --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
                --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
                --font-size-xs: 13px;
                --font-size-sm: 13px;
                --font-size-base: 14px;
                --font-size-lg: 16px;
                --font-size-xl: 20px;
                --font-size-2xl: 28px;
                --font-weight-normal: 400;
                --font-weight-medium: 500;
                --font-weight-semibold: 600;
                --line-height: 1.6;
                --space-xs: 4px;
                --space-sm: 8px;
                --space-md: 16px;
                --space-lg: 24px;
                --space-xl: 40px;
                --space-2xl: 64px;
                --radius-sm: 4px;
                --radius-md: 8px;
                --radius-lg: 12px;
                --transition: 150ms ease;
                --sidebar-width: 220px;
                --sidebar-width-collapsed: 60px;
            }

            html {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                border-radius: 12px;
                background: transparent;
            }

            body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                background: transparent;
                color: var(--text-primary);
                line-height: var(--line-height);
                border-radius: 12px;
                border: none;
                font-family: var(--font);
                font-size: var(--font-size-base);
                font-weight: var(--font-weight-normal);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            * {
                box-sizing: border-box;
            }

            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                background: var(--border-strong);
                border-radius: 3px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #444444;
            }

            context-halo-app {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <script src="assets/marked-4.3.0.min.js"></script>
        <script src="assets/highlight-11.9.0.min.js"></script>
        <link rel="stylesheet" href="assets/highlight-vscode-dark.min.css" />
        <script type="module" src="components/app/ContextHaloApp.js"></script>

        <context-halo-app id="contextHalo"></context-halo-app>
        <script src="utils/renderer.js"></script>
    </body>
</html>
