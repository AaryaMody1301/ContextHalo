name: Diagnose blank Settings render

on:
  push:
    branches:
      - fix/gemini-screen-reliability
    paths:
      - .github/workflows/diagnose-settings-render.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/gemini-screen-reliability
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Instrument Settings probe in workspace
        shell: pwsh
        run: |
          $path = 'scripts/renderer-behavior-smoke.js'
          $source = Get-Content -Raw $path
          $needle = @'
                    const unifiedPage = settingsInApp?.shadowRoot?.querySelector('.unified-page');
                    const settingsOverflow = unifiedPage ? getComputedStyle(unifiedPage).overflowY : '';
'@
          $replacement = @'
                    let settingsUpdateError = '';
                    if (settingsInApp) {
                        try { await settingsInApp.updateComplete; }
                        catch (error) { settingsUpdateError = String(error?.stack || error?.message || error).slice(0, 4000); }
                    }
                    const unifiedPage = settingsInApp?.shadowRoot?.querySelector('.unified-page');
                    const settingsOverflow = unifiedPage ? getComputedStyle(unifiedPage).overflowY : '';
'@
          if (-not $source.Contains($needle)) { throw 'Settings instrumentation insertion point not found' }
          $source = $source.Replace($needle, $replacement)
          $needle2 = @'
                        settings: settingsReady,
                        parentCanScroll,
'@
          $replacement2 = @'
                        settings: settingsReady,
                        settingsDebug: {
                            currentView: app?.currentView || null,
                            present: Boolean(settingsInApp),
                            shadow: Boolean(settingsInApp?.shadowRoot),
                            childCount: settingsInApp?.shadowRoot?.childNodes?.length ?? -1,
                            text: String(settingsInApp?.shadowRoot?.textContent || '').slice(0, 2000),
                            html: String(settingsInApp?.shadowRoot?.innerHTML || '').slice(0, 4000),
                            updateError: settingsUpdateError,
                            constructorName: settingsInApp?.constructor?.name || null,
                            definedName: customElements.get('customize-view')?.name || null,
                        },
                        parentCanScroll,
'@
          if (-not $source.Contains($needle2)) { throw 'Settings diagnostic return point not found' }
          Set-Content -NoNewline -Path $path -Value $source.Replace($needle2, $replacement2)
          node --check $path
      - name: Run Electron behavior smoke with diagnostics
        shell: pwsh
        run: |
          & ".\node_modules\.bin\electron.cmd" . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
