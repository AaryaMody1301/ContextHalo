name: Apply mounted Settings lifecycle fallback

on:
  push:
    branches:
      - fix/gemini-screen-reliability
    paths:
      - .github/workflows/apply-mounted-view-lit-fallback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/gemini-screen-reliability
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply mounted Settings lifecycle fallback
        run: node .github/repair-data/mounted-view-lit-fallback.cjs
      - name: Validate source syntax
        run: node --check src/components/app/ContextHaloApp.js
      - name: Remove one-time machinery
        run: |
          rm -f .github/repair-data/mounted-view-lit-fallback.cjs
          rm -f .github/workflows/apply-mounted-view-lit-fallback.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover Settings Lit lifecycle after navigation"
          git push origin HEAD:fix/gemini-screen-reliability
