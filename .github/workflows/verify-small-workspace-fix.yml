name: Verify small workspace repair
on:
  push:
    branches: [fix/windows-workspace-search-recovery]
    paths: ['.github/workflows/verify-small-workspace-fix.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'AaryaMody1301/ContextHalo' && github.ref == 'refs/heads/fix/windows-workspace-search-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/windows-workspace-search-recovery
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply checksum-verified source edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const packed = '';
          const entries = JSON.parse(require('node:zlib').brotliDecompressSync(Buffer.from(packed, 'base64')));
          const hash = text => crypto.createHash('sha256').update(text).digest('hex');
          const edits = entries.map(([name, before, after, operations]) => {
              if (!/^(src\/|tests\/|scripts\/)/.test(name) || name.includes('..')) throw Error('Unsafe source path');
              const text = fs.readFileSync(name, 'utf8').replace(/\r\n/g, '\n');
              if (hash(text) !== before) throw Error('Source changed: ' + name);
              const lines = text.match(/[^\n]*\n|[^\n]+$/g) || [];
              for (const [start, end, replacement] of [...operations].reverse()) lines.splice(start, end-start, replacement);
              const result = lines.join('');
              if (hash(result) !== after) throw Error('Result mismatch: ' + name);
              return [name, result];
          });
          for (const [name, result] of edits) { fs.writeFileSync(name, result); console.log('Verified ' + name); }
          NODE
      - name: Validate source and all behavioral regressions
        run: |
          npm run check
          npm test
      - name: Commit only verified source on repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts
          git commit -m 'fix: preserve usable answers on small scaled desktops and fail closed on missing capture sources'
          git push origin HEAD:fix/windows-workspace-search-recovery
