name: Apply Settings smoke hotfix

on:
  push:
    branches:
      - hotfix/settings-smoke-save-states

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Patch mounted Settings save state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (source, from, to, label) => {
              const first = source.indexOf(from);
              if (first < 0) throw new Error(`Expected ${label} was not found.`);
              if (source.indexOf(from, first + from.length) >= 0) throw new Error(`Expected exactly one ${label}.`);
              return source.slice(0, first) + to + source.slice(first + from.length);
          };

          const viewPath = 'src/components/views/CustomizeView.js';
          let source = fs.readFileSync(viewPath, 'utf8');

          source = replaceOnce(
              source,
              "    retrySaves() {\n        if (this.saveStates.load) { this.saveStates = {}; this.settingsLoading = true; return this._loadFromStorage(); }",
              "    retrySaves() {\n        const saveStates = this.saveStates || {};\n        if (saveStates.load) { this.saveStates = {}; this.settingsLoading = true; return this._loadFromStorage(); }",
              'retrySaves save-state access'
          );
          source = replaceOnce(
              source,
              "    renderSaveFeedback() {\n        const values = Object.values(this.saveStates);\n        const failed = values.includes('failed') || this.saveStates.load;",
              "    renderSaveFeedback() {\n        const saveStates = this.saveStates || {};\n        const values = Object.values(saveStates);\n        const failed = values.includes('failed') || Boolean(saveStates.load);",
              'renderSaveFeedback save-state access'
          );
          source = replaceOnce(
              source,
              "failed ? (this.saveStates.load || 'Some changes are not saved. Your edits are retained.')",
              "failed ? (saveStates.load || 'Some changes are not saved. Your edits are retained.')",
              'renderSaveFeedback load message'
          );
          source = replaceOnce(
              source,
              'Boolean(this.saveStates.load)',
              'Boolean(this.saveStates?.load)',
              'Settings fieldset save-state guard'
          );
          fs.writeFileSync(viewPath, source);

          const testPath = 'tests/ui-save-feedback.test.js';
          let tests = fs.readFileSync(testPath, 'utf8');
          const anchor = "test('storage writes are checked, serialized and snapshotted; failed writes do not block later edits', async () => {";
          const regression = `test('Settings first render tolerates an unset save-state bag', () => {
              const view = settings({ updatePreference: async () => ({ success: true }) });
              view.saveStates = undefined;
              assert.doesNotThrow(() => view.renderSaveFeedback());
              assert.doesNotThrow(() => view.retrySaves());
          });

          `;
          if (!tests.includes(anchor)) throw new Error('Expected UI feedback test anchor was not found.');
          if (!tests.includes("Settings first render tolerates an unset save-state bag")) tests = tests.replace(anchor, regression + anchor);
          fs.writeFileSync(testPath, tests);
          NODE

      - name: Validate targeted repair
        run: |
          node scripts/check-source.js
          node --test tests/ui-save-feedback.test.js

      - name: Remove one-time workflow
        run: git rm .github/workflows/apply-settings-smoke-hotfix.yml

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/views/CustomizeView.js tests/ui-save-feedback.test.js
          git commit -m "fix: guard Settings save feedback during mounted render"
          git push origin HEAD:hotfix/settings-smoke-save-states
