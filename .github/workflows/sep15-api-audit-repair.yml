name: Apply Sep 15 API audit repair

on:
  push:
    branches: [fix/sep15-live-api-audit]

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/sep15-live-api-audit

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Apply exact audit repair
        shell: pwsh
        run: |
          if (Test-Path scripts/apply-sep15-audit.cjs) {
            node scripts/apply-sep15-audit.cjs
            $assertions = @(
              @{ Path = 'tests/final-contracts.test.js'; From = 'assert.deepEqual(f.connections[2].config.historyConfig, { initialHistoryInClientContent: true });'; To = 'assert.equal(f.connections[2].config.historyConfig?.initialHistoryInClientContent, true);' },
              @{ Path = 'tests/gemini-live-production-wiring.test.js'; From = 'assert.deepEqual(fixture.connections[1].config.historyConfig, { initialHistoryInClientContent: true });'; To = 'assert.equal(fixture.connections[1].config.historyConfig?.initialHistoryInClientContent, true);' },
              @{ Path = 'tests/gemini-recovery.test.js'; From = 'assert.deepEqual(f.connections[1].config.historyConfig, { initialHistoryInClientContent: true });'; To = 'assert.equal(f.connections[1].config.historyConfig?.initialHistoryInClientContent, true);' }
            )
            foreach ($change in $assertions) {
              $source = Get-Content -Raw $change.Path
              if (!$source.Contains($change.From)) { throw "Expected assertion not found in $($change.Path)" }
              Set-Content -NoNewline -Encoding utf8 $change.Path ($source.Replace($change.From, $change.To))
            }
          } else {
            Write-Host 'Repair already applied.'
          }

      - name: Install locked dependencies
        if: ${{ hashFiles('scripts/apply-sep15-audit.cjs') == '' }}
        run: npm ci --no-audit --no-fund

      - name: Validate repaired source
        run: |
          npm run check
          npm test

      - name: Commit repaired tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs scripts .github/repair-data
          if (git diff --cached --quiet) {
            Write-Host 'No repair changes to commit.'
            exit 0
          }
          git commit -m "fix: align Gemini Live reconnect history with 3.1 API"
          git push origin HEAD:fix/sep15-live-api-audit
