name: Verify HTTP recovery and Search isolation
on:
  push:
    branches: [fix/http503-search-boundaries]
    paths: [.github/workflows/provider-recovery-once.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5
      - name: Apply exact locally verified repair
        shell: bash
        env:
          PATCH_0: 
          PATCH_1: 
          PATCH_2: 
          PATCH_3: 
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REPOSITORY'] == 'AaryaMody1301/ContextHalo'
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/http503-search-boundaries'
          workflow = '.github/workflows/provider-recovery-once.yml'
          assert git('diff', '--name-only', '2a9ffe8a2b4bdec5d3ff11715b3abd39aaf271b2', 'HEAD') == workflow
          patch = gzip.decompress(base64.b64decode(''.join(os.environ[f'PATCH_{i}'] for i in range(4)), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e5b3c9a89dded668bb4d14277ef1a92ed57c1243bade699cb85e099d4d1429dc'
          manifest = '''scripts/renderer-behavior-smoke.js e74a3d6fc3cbe1e0b1bd6a373b3a8bf32e20b4b512bff754a6124677febf825e
          src/components/app/ContextHaloApp.js 9167f614f49111772f7ff36098ef3dd2914262a6444d9471c83bfd295e50f38c
          src/utils/gemini.js e4ddad95fd391d444305fc875469d58242c7d629ad627575e7ed3845c86ddd7d
          src/utils/localai.js 6a7a01fd645145b411ab93f2c9e656244f6c102baeb38483bbe6ee1624baa9bc
          src/utils/windowsLocalAiRuntime.js 9683f27f9004481639500d2c33123d5fb15c4143d724a7e4711b29490a2fe7c3
          src/utils/windowsProviderTransport.js e763a0e03ae233e91985a9853a86ac36bf1f023a83434146e6cc53dd88bfd1c4
          tests/gemini-recovery.test.js 8c20931f121dc4d839d870f34176afda3f83972a46047f81c77b3031a43946f5
          tests/local-provider-behavior.test.js ed65b07a8520c86caad9501246a8f1a547b84d6754ca1ea02a57a16494796b14
          tests/sdk-wire-contract.test.js 9cc0af0f8963376b3271c52ac103bc3c39e4978ba2389dfca8d974693bd4dadb
          tests/startup-regressions.test.js 9a70b957d89eee55e5c1828ea66246032fa5d8f4fe2f10792f7c35d5895d0fae
          tests/ui-request-recovery.test.js 4604a86aa6376c440d0b269614175ff8bb69d668d8e85b51766af85d13cc7869
          tests/windows-runtime-final.test.js 2dec7070cb9bc09590bf545355062b2660a66f556983cdb9a8967e32dcd6bd9f
          tests/gemini-service-recovery.test.js a597034d438800f5ce3ee3e600fe60e676c2b9ef76d4ad23b6dcc3e957e06600
          docs/PROVIDER_RECOVERY_AUDIT_2026-09-19.md 10f194472231f4104aee3b16b063aa374851eb00787c6cb4e9abb815c84fc868'''
          hashes = dict(line.split() for line in manifest.splitlines())
          for name in hashes:
              p = pathlib.Path(name)
              if p.exists(): p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          patch_file = pathlib.Path(os.environ['RUNNER_TEMP']) / 'provider-recovery.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch_file)], check=True)
          for name, expected in hashes.items():
              actual = hashlib.sha256(pathlib.Path(name).read_bytes().replace(b'\r\n', b'\n')).hexdigest()
              assert actual == expected, name
          pathlib.Path(workflow).unlink()
          subprocess.run(['git', 'add', '--', *hashes, workflow], check=True)
          print('All 14 repaired files match the locally tested SHA-256 manifest.')
          PY
      - name: Publish repair only on its branch
        id: publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve Search and recover Gemini HTTP failures without losing session state'
          git push origin HEAD:refs/heads/fix/http503-search-boundaries
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: apply
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Run all regression and installed-SDK tests
        run: npm test
      - name: Verify sandboxed Windows renderer
        shell: pwsh
        run: |
          & '.\node_modules\.bin\electron.cmd' . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Renderer smoke failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ContextHalo-HTTP-Recovery-Evidence
          path: qa-results/
          retention-days: 7
