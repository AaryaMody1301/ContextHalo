name: Verify HTTP recovery and Search isolation
on:
  push:
    branches: [fix/http503-search-boundaries]
    paths: [.github/workflows/provider-recovery-once.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact locally verified patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          echo 'Patch staging placeholder: refusing to apply until complete payload is installed.'
          exit 1
