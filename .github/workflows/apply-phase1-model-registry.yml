name: Apply Phase 1 Dynamic Model Registry

on:
  push:
    branches: [phase1/dynamic-model-registry]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-2022

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase1/dynamic-model-registry
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply Phase 1 changes
        shell: pwsh
        run: node scripts/apply-phase1-model-registry.js

      - name: Remove temporary apply files
        shell: pwsh
        run: |
          Remove-Item -Force scripts/apply-phase1-model-registry.js
          Remove-Item -Force .github/workflows/apply-phase1-model-registry.yml

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Run source validation
        shell: pwsh
        run: npm run check

      - name: Run tests
        shell: pwsh
        run: npm test

      - name: Run Electron renderer smoke test
        shell: pwsh
        run: |
          & ".\node_modules\.bin\electron.cmd" . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Electron renderer smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Build portable Windows EXE
        shell: pwsh
        run: npm run build:portable -- --publish never

      - name: Verify portable EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -File -Filter "ContextHalo-Windows-x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "Portable Windows EXE was not produced." }
          Write-Host "Portable EXE: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Commit validated Phase 1 implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add dynamic provider model registry"
          git push origin HEAD:phase1/dynamic-model-registry
