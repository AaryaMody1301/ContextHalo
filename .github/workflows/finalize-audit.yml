name: Finalize ContextHalo audit branch

on:
  push:
    branches: [final-api-ui-audit-20260913]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reconstruct and apply audited patch
        id: stage
        shell: bash
        run: |
          if [ ! -f .audit-patch/part-1 ]; then
            echo 'Audit staging already finalized.'
            echo 'did_apply=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .audit-patch/part-* > /tmp/contexthalo-final.patch.gz.b64
          base64 -d /tmp/contexthalo-final.patch.gz.b64 | gzip -d > /tmp/contexthalo-final.patch
          echo '2fbde931886dfdedfee2b8c5491dd0edb10f3dd2ca23c7c25339aa278e3d8fe4  /tmp/contexthalo-final.patch' | sha256sum -c -
          git apply --check --ignore-space-change --whitespace=nowarn /tmp/contexthalo-final.patch
          git apply --ignore-space-change --whitespace=nowarn /tmp/contexthalo-final.patch
          git diff --name-only -z --diff-filter=ACMRT | xargs -0 -r sed -i 's/\r$//'
          git checkout -- .github/workflows/build-windows.yml
          rm -rf .audit-patch
          echo 'did_apply=true' >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.stage.outputs.did_apply == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate final source
        if: steps.stage.outputs.did_apply == 'true'
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --dry-run
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run check
          npm test
          git diff --check

      - name: Commit finalized audit
        if: steps.stage.outputs.did_apply == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize API, security, and provider hardening'
          git push origin HEAD:final-api-ui-audit-20260913
