name: Apply Gemini Live production wiring

on:
  push:
    branches: [fix/gemini-live-production-wiring]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/gemini-live-production-wiring

      - name: Apply deterministic production wiring patch
        run: node scripts/apply-gemini-live-production-wiring.js

      - name: Validate changed JavaScript syntax
        run: |
          node --check src/utils/gemini.js
          node --check src/utils/geminiLiveRuntime.js
          node --check tests/gemini-live-production-wiring.test.js

      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-gemini-live-production-wiring.js
          rm .github/workflows/apply-gemini-live-production-wiring.yml

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: wire Gemini Live recovery into production"
          git push origin HEAD:fix/gemini-live-production-wiring
