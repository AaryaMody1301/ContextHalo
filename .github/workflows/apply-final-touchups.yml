name: Apply final release touchups

on:
  push:
    branches: [fix/final-release-readiness]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-final-touchups]')
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-release-readiness

      - name: Apply narrow verified replacements
        shell: pwsh
        run: |
          $path = 'src/components/views/MainView.js'
          $text = Get-Content -Raw $path
          $change = '                            @change=${event => { if (event.target.value.trim()) void this._saveProviderKey(provider, event.target.value); }}' + "`r`n"
          $text = $text.Replace($change, '')
          $text = $text.Replace("    // ── Cloud mode ──`r`n    // Supported providers share one setup editor.`r`n    // the codebase, but the renderer no longer exposes this setup path.`r`n", "    // ── Provider setup ──`r`n    // Gemini and Groq share one editor; the retired Cloud provider has been removed.`r`n")
          $text = $text.Replace("        setTimeout(() => {`r`n                this._keyError = false;", "        setTimeout(() => {`r`n            this._keyError = false;")
          Set-Content -NoNewline -Encoding utf8 $path $text

          foreach ($nativePath in @('src/utils/native-ai-runtime.js', 'src/utils/windowsLocalAiRuntime.js')) {
            $native = Get-Content -Raw $nativePath
            $native = $native.Replace('does not provide mmproj-BF16.gguf', 'does not provide a supported multimodal projector')
            Set-Content -NoNewline -Encoding utf8 $nativePath $native
          }

      - name: Verify touched JavaScript parses
        shell: pwsh
        run: |
          node --check src/components/views/MainView.js
          node --check src/utils/native-ai-runtime.js
          node --check src/utils/windowsLocalAiRuntime.js

      - name: Commit and remove this one-shot workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-final-touchups.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src/components/views/MainView.js src/utils/native-ai-runtime.js src/utils/windowsLocalAiRuntime.js .github/workflows/apply-final-touchups.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: remove duplicate credential save and stale release wording'
          if ($LASTEXITCODE -ne 0) { throw 'Touchup commit failed' }
          git push origin HEAD:fix/final-release-readiness
          if ($LASTEXITCODE -ne 0) { throw 'Branch advanced; refusing non-fast-forward push' }
