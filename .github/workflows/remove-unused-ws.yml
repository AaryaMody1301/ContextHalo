name: Remove unused direct websocket dependency

on:
  push:
    branches: [fix/final-release-readiness]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[remove-unused-ws]')
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-release-readiness

      - name: Remove unused direct dependency
        shell: pwsh
        run: |
          npm uninstall --save ws --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'); if (p.dependencies.ws) process.exit(1)"
          node -e "const l=require('./package-lock.json'); if (l.packages[''].dependencies.ws) process.exit(1)"

      - name: Commit and remove this one-shot workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/remove-unused-ws.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- package.json package-lock.json .github/workflows/remove-unused-ws.yml
          git diff --cached --check
          git commit -m 'chore: remove unused direct websocket dependency'
          if ($LASTEXITCODE -ne 0) { throw 'Dependency cleanup commit failed' }
          git push origin HEAD:fix/final-release-readiness
          if ($LASTEXITCODE -ne 0) { throw 'Branch advanced; refusing non-fast-forward push' }
