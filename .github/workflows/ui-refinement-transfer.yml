name: Transfer verified UI refinement
on:
  push:
    branches: [fix/remaining-ui-ux]
    paths: ['.github/workflows/ui-refinement-transfer.yml']
permissions:
  contents: read
jobs:
  apply:
    if: >-
      github.repository == 'AaryaMody1301/ContextHalo' && github.ref == 'refs/heads/fix/remaining-ui-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/remaining-ui-ux
          fetch-depth: 2
      - name: Apply exact reviewed source refinement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '8559de1758e67b1161cc26f747e689653c650954'
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          encoded = ''''''
          encoded = encoded.replace('8thIyfxPyUPUeg', '8thIyfxPUeg')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 16858 and hashlib.sha256(patch).hexdigest() == '2951e565698e3605a6722fa62dc02ec6662517486f312a5c21c93676ef16e0bb'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git config user.name 'ContextHalo repair validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve readers, full-width compact HUD and coherent readable themes'
          git push origin HEAD:fix/remaining-ui-ux
