name: Transfer verified UI repair
on:
  push:
    branches: [fix/remaining-ui-ux]
    paths: ['.github/ui-transfer/**', '.github/workflows/ui-repair-transfer.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'AaryaMody1301/ContextHalo' && github.ref == 'refs/heads/fix/remaining-ui-ux' && github.event.head_commit.message == 'build: transfer checksum-verified UI repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/remaining-ui-ux
          fetch-depth: 2
      - name: Apply only the verified requested source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'b23676432095bf6f3c187007bb06d66f76251129'
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/ui-transfer').glob('part??'))
          assert len(parts) == 7
          compressed = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'ea7e048fb37fd982c1358729740620232b60ad696c1d8e1e28997860a6ca720c'
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(compressed, max_length=330000)
          assert decoder.eof and len(patch) == 329145
          paths = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
          assert len(paths) == 27 and all('..' not in p and (p.startswith(('src/', 'tests/', 'scripts/')) or p == 'preload.js') for p in paths)
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git config user.name 'ContextHalo repair validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair remaining Windows keyboard, history, save and workspace flows'
          git push origin HEAD:fix/remaining-ui-ux
