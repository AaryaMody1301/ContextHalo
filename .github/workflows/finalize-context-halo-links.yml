name: Finalize ContextHalo Links

on:
  push:
    branches: [refactor/contexthalo-rebrand]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize ContextHalo project links'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/contexthalo-rebrand
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Finalize ContextHalo links
        run: node scripts/finalize-context-halo-links.js

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows
          git add -A
          git commit -m "Finalize ContextHalo project links"
          git push origin HEAD:refactor/contexthalo-rebrand
