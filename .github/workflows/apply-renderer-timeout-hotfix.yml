name: Apply renderer timeout loading hotfix

on:
  push:
    branches:
      - hotfix/settings-smoke-save-states

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Remove renderer-time CommonJS path dependency
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const rendererPath = 'src/utils/renderer.js';
          let renderer = fs.readFileSync(rendererPath, 'utf8');
          const badRequire = "const { SCREEN_RENDERER_TIMEOUT_MS } = require('./geminiScreenReliability');\n";
          if (!renderer.includes(badRequire)) throw new Error('Expected renderer reliability require was not found.');
          renderer = renderer.replace(badRequire, '');

          const bufferLine = 'const BUFFER_SIZE = 4096; // Increased buffer size for smoother audio\n';
          if (!renderer.includes(bufferLine)) throw new Error('Expected renderer buffer constant was not found.');
          renderer = renderer.replace(bufferLine, bufferLine + 'const SCREEN_RENDERER_TIMEOUT_MS = 80000; // Kept in sync with geminiScreenReliability by regression test.\n');

          const bridgeBlock = `// Consolidated contextHalo object - all functions in one place
          // This file is a classic script while the Lit UI is loaded as ES modules. Use var so
          // the renderer API is a true global binding that module code can resolve reliably.
          var contextHalo = {`;
          const originalBlock = `// Consolidated contextHalo object - all functions in one place
          const contextHalo = {`;
          if (!renderer.includes(bridgeBlock)) throw new Error('Expected temporary renderer bridge block was not found.');
          renderer = renderer.replace(bridgeBlock, originalBlock);
          fs.writeFileSync(rendererPath, renderer);

          const testPath = 'tests/gemini-screen-reliability.test.js';
          let tests = fs.readFileSync(testPath, 'utf8');
          const anchor = `test('low thinking is enabled only for compatible Gemini Flash models', () => {`;
          const regression = `test('renderer watchdog does not depend on a page-relative CommonJS require', () => {
              const source = fs.readFileSync('src/utils/renderer.js', 'utf8');
              assert.doesNotMatch(source, /require\\(['\"]\\.\\/geminiScreenReliability['\"]\\)/);
              const match = source.match(/const SCREEN_RENDERER_TIMEOUT_MS = (\\d+);/);
              assert.ok(match, 'renderer watchdog constant is declared locally');
              assert.equal(Number(match[1]), SCREEN_RENDERER_TIMEOUT_MS);
          });

          `;
          if (!tests.includes(anchor)) throw new Error('Expected Gemini screen reliability test anchor was not found.');
          if (!tests.includes('renderer watchdog does not depend on a page-relative CommonJS require')) {
              tests = tests.replace(anchor, regression + anchor);
          }
          fs.writeFileSync(testPath, tests);
          NODE

          if [ -f tests/renderer-global-bridge.test.js ]; then
            git rm tests/renderer-global-bridge.test.js
          fi

      - name: Validate targeted repair
        run: |
          node scripts/check-source.js
          node --test tests/gemini-screen-reliability.test.js tests/ui-save-feedback.test.js

      - name: Remove one-time workflow
        run: git rm .github/workflows/apply-renderer-timeout-hotfix.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/renderer.js tests/gemini-screen-reliability.test.js tests/ui-save-feedback.test.js
          git commit -m "fix: keep renderer watchdog load-safe"
          git push origin HEAD:hotfix/settings-smoke-save-states
