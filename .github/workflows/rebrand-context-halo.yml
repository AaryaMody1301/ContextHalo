name: Apply ContextHalo Rebrand

on:
  push:
    branches: [refactor/contexthalo-rebrand]

permissions:
  contents: write

jobs:
  rebrand:
    if: github.event.head_commit.message != 'Apply ContextHalo rebrand'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/contexthalo-rebrand
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply rebrand
        run: node scripts/apply-context-halo-rebrand.js

      - name: Commit generated rebrand
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub Actions tokens cannot modify workflow files without the separate workflows permission.
          # Keep workflow changes for the GitHub connector to apply after the generated source rebrand lands.
          git restore .github/workflows
          git add -A
          git commit -m "Apply ContextHalo rebrand"
          git push origin HEAD:refactor/contexthalo-rebrand
