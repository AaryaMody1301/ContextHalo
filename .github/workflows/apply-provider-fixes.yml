name: Apply Phase 1 Provider Fixes

on:
  push:
    branches:
      - phase-1-complete-fixes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-complete-fixes

      - name: Apply provider fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/utils/gemini.js')
          s = p.read_text()

          # Current Groq output budget.
          s = s.replace('const GROQ_MAX_COMPLETION_TOKENS = 768;', 'const GROQ_MAX_COMPLETION_TOKENS = 2048;')

          # Track actual provider rate-limit state rather than enforcing guessed quotas.
          if 'let groqRateLimitSnapshot = null;' not in s:
              s = s.replace('let currentSystemPrompt = null;', 'let currentSystemPrompt = null;\nlet geminiSessionResumptionHandle = null;\nlet groqRateLimitSnapshot = null;', 1)

          if 'function parseGroqRateLimitHeaders(headers)' not in s:
              marker = 'function formatGroqError(status, body, headers) {'
              helper = '''function parseGroqRateLimitHeaders(headers) {
    if (!headers?.get) return null;
    const read = name => headers.get(name);
    const snapshot = {
        limitRequests: read('x-ratelimit-limit-requests'),
        remainingRequests: read('x-ratelimit-remaining-requests'),
        resetRequests: read('x-ratelimit-reset-requests'),
        limitTokens: read('x-ratelimit-limit-tokens'),
        remainingTokens: read('x-ratelimit-remaining-tokens'),
        resetTokens: read('x-ratelimit-reset-tokens'),
        retryAfter: read('retry-after'),
    };
    return Object.values(snapshot).some(Boolean) ? snapshot : null;
}

function sendGroqRateLimitStatus(headers) {
    const snapshot = parseGroqRateLimitHeaders(headers);
    if (!snapshot) return;
    groqRateLimitSnapshot = snapshot;
    logTransportEvent('groq.rate_limits', snapshot);
    sendToRenderer('groq-rate-limits', snapshot);
}

'''
              s = s.replace(marker, helper + marker, 1)

          # Improve Groq diagnostics.
          s = s.replace("    if (status === 413) return 'Groq request is too large. Reduce context.';", "    if (status === 413) return 'Groq request is too large. Reduce context or image size.';\n    if (status === 404) return 'Groq model or endpoint was not found. Check the selected model.';")

          # Never run arbitrary renderer JavaScript just to read a setting.
          if 'function getStoredSetting(key, defaultValue)' in s and 'return defaultValue;\n}\n\n// helper to check if groq has been configured' in s:
              start = s.index('async function getStoredSetting(key, defaultValue) {')
              end = s.index('// helper to check if groq has been configured', start)
              replacement = '''async function getStoredSetting(key, defaultValue) {
    try {
        const value = await getConfig()?.preferences?.[key];
        return value == null ? defaultValue : String(value);
    } catch (error) {
        console.error('Error getting stored setting for', key, ':', error.message);
        return defaultValue;
    }
}

'''
              s = s[:start] + replacement + s[end:]

          # Persistent SSE buffer for both text and image streams.
          text_pattern = re.compile(r"const reader = response\.body\.getReader\(\);\n        const decoder = new TextDecoder\(\);\n        let fullText = '';\n        let isFirst = true;\n        let finishReason = null;\n\n        while \(true\) \{.*?\n        \}\n\n        const cleanedResponse", re.S)
          text_repl = '''sendGroqRateLimitStatus(response.headers);
        const reader = response.body?.getReader();
        if (!reader) throw new Error('Groq returned no response body for streaming completion.');
        const decoder = new TextDecoder();
        let fullText = '';
        let isFirst = true;
        let finishReason = null;
        let sseBuffer = '';

        const processEvent = data => {
            if (!data || data === '[DONE]') return;
            try {
                const json = JSON.parse(data);
                finishReason = json.choices?.[0]?.finish_reason || finishReason;
                const token = json.choices?.[0]?.delta?.content || '';
                if (!token) return;
                fullText += token;
                const displayText = stripThinkingTags(fullText);
                if (displayText) {
                    sendToRenderer(isFirst ? 'new-response' : 'update-response', displayText);
                    isFirst = false;
                }
            } catch (parseError) {
                logTransportEvent('groq.text.stream_parse_error', { data, error: parseError.message });
            }
        };

        while (true) {
            const { done, value } = await reader.read();
            sseBuffer += decoder.decode(value || new Uint8Array(), { stream: !done });
            const events = sseBuffer.split(/\\r?\\n\\r?\\n/);
            sseBuffer = events.pop() || '';
            for (const event of events) {
                const data = event.split(/\\r?\\n/)
                    .filter(line => line.startsWith('data:'))
                    .map(line => line.slice(5).trimStart())
                    .join('\\n')
                    .trim();
                processEvent(data);
            }
            if (done) break;
        }
        if (sseBuffer.trim()) {
            for (const line of sseBuffer.split(/\\r?\\n/)) {
                if (line.startsWith('data:')) processEvent(line.slice(5).trimStart());
            }
        }

        const cleanedResponse'''
          s, n = text_pattern.subn(text_repl, s, count=1)
          print('patched text SSE blocks:', n)

          # Image stream: replace the next old chunk parser if still present.
          image_pattern = re.compile(r"const reader = response\.body\.getReader\(\);\n        const decoder = new TextDecoder\(\);\n        let fullText = '';\n        let isFirst = true;\n        let finishReason = null;\n\n        while \(true\) \{.*?\n        \}\n\n        const cleanedResponse", re.S)
          image_repl = text_repl.replace("Groq returned no response body for streaming completion.", "Groq returned no response body for image streaming.")
          image_repl = image_repl.replace("groq.text.stream_parse_error", "groq.image.stream_parse_error")
          s, n = image_pattern.subn(image_repl, s, count=1)
          print('patched image SSE blocks:', n)

          # Gemini Live multi-part output and session-resumption handle support.
          if 'message.sessionResumptionUpdate' not in s:
              anchor = "logTransportEvent('gemini.live.message', message);"
              if anchor in s:
                  s = s.replace(anchor, anchor + "\n\n                    if (message.sessionResumptionUpdate?.token) geminiSessionResumptionHandle = message.sessionResumptionUpdate.token;\n                    if (message.sessionResumptionUpdate?.newHandle) geminiSessionResumptionHandle = message.sessionResumptionUpdate.newHandle;", 1)

          if 'modelTurn?.parts' not in s:
              needle = "                    // Handle generation complete"
              block = '''                    for (const part of message.serverContent?.modelTurn?.parts || []) {
                        if (!part?.text || currentProviderMode === 'groq') continue;
                        const isFirstChunk = messageBuffer === '';
                        messageBuffer += part.text;
                        sendToRenderer(isFirstChunk ? 'new-response' : 'update-response', messageBuffer);
                    }

'''
              if needle in s:
                  s = s.replace(needle, block + needle, 1)

          if 'sessionResumption:' not in s:
              marker = "                systemInstruction: {"
              if marker in s:
                  s = s.replace(marker, "                sessionResumption: geminiSessionResumptionHandle ? { handle: geminiSessionResumptionHandle } : {},\n" + marker, 1)

          # Reset stale state at new session and close.
          s = s.replace('function initializeNewSession(profile = null, customPrompt = null) {\n    currentSessionId', 'function initializeNewSession(profile = null, customPrompt = null) {\n    geminiSessionResumptionHandle = null;\n    currentSessionId', 1)
          s = s.replace("                currentProviderMode = 'byok';\n                closeTransportLog();", "                currentProviderMode = 'byok';\n                sessionParams = null;\n                geminiSessionResumptionHandle = null;\n                closeTransportLog();", 1)

          p.write_text(s)
          PY
          node --check src/utils/gemini.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/gemini.js
          if git diff --cached --quiet; then
            echo "No provider changes required."
          else
            git commit -m "phase1: harden Groq and Gemini provider runtime"
            git push origin HEAD:phase-1-complete-fixes
          fi
