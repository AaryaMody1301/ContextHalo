name: Apply Phase 1 Provider Fixes

on:
  push:
    branches: [phase-1-complete-fixes]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'phase1: apply provider fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-1-complete-fixes
          fetch-depth: 1

      - name: Patch provider reliability
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/utils/gemini.js')
          s = p.read_text()

          s = s.replace(
              "const GROQ_MAX_COMPLETION_TOKENS = 768;",
              "const GROQ_MAX_COMPLETION_TOKENS = 2048;"
          )

          s = s.replace(
              "let currentSystemPrompt = null;",
              "let currentSystemPrompt = null;\nlet geminiSessionResumptionHandle = null;\nlet groqRateLimitSnapshot = null;"
          )

          old = '''function formatGroqError(status, body, headers) {
              if (status === 429) {
                  const retryAfter = headers?.get?.('retry-after');
                  const reset = headers?.get?.('x-ratelimit-reset-tokens') || headers?.get?.('x-ratelimit-reset-requests');
                  const detail = compactGroqErrorBody(body);
                  return retryAfter ? `Groq rate limit reached. Retry in ${retryAfter}s.` : `Groq rate limit reached${reset ? ` (reset ${reset})` : ''}${detail ? `: ${detail.slice(0, 180)}` : '.'}`;
              }
              if (status === 401) return 'Groq authentication failed. Check the API key.';
              if (status === 403) return 'Groq request is not permitted for this key/model.';
              if (status === 413) return 'Groq request is too large. Reduce context.';
              return `Groq error: ${status}${body ? ` - ${body.slice(0, 180)}` : ''}`;
          }'''

          new = '''function parseGroqRateLimitHeaders(headers) {
              if (!headers?.get) return null;
              const read = name => headers.get(name);
              const snapshot = {
                  limitRequests: read('x-ratelimit-limit-requests'),
                  remainingRequests: read('x-ratelimit-remaining-requests'),
                  resetRequests: read('x-ratelimit-reset-requests'),
                  limitTokens: read('x-ratelimit-limit-tokens'),
                  remainingTokens: read('x-ratelimit-remaining-tokens'),
                  resetTokens: read('x-ratelimit-reset-tokens'),
                  retryAfter: read('retry-after'),
              };
              return Object.values(snapshot).some(Boolean) ? snapshot : null;
          }

          function sendGroqRateLimitStatus(headers) {
              const snapshot = parseGroqRateLimitHeaders(headers);
              if (!snapshot) return;
              groqRateLimitSnapshot = snapshot;
              logTransportEvent('groq.rate_limits', snapshot);
              if (snapshot.remainingTokens || snapshot.remainingRequests) {
                  const parts = [];
                  if (snapshot.remainingTokens) parts.push(`tokens ${snapshot.remainingTokens}`);
                  if (snapshot.remainingRequests) parts.push(`requests ${snapshot.remainingRequests}`);
                  sendToRenderer('groq-rate-limits', snapshot);
                  sendToRenderer('update-status', `Groq ready (${parts.join(', ')} remaining)`);
              }
          }

          function formatGroqError(status, body, headers) {
              const snapshot = parseGroqRateLimitHeaders(headers);
              if (status === 429) {
                  const retryAfter = snapshot?.retryAfter;
                  const reset = snapshot?.resetTokens || snapshot?.resetRequests;
                  const detail = compactGroqErrorBody(body);
                  return retryAfter
                      ? `Groq rate limit reached. Retry in ${retryAfter}s.`
                      : `Groq rate limit reached${reset ? ` (reset ${reset})` : ''}${detail ? `: ${detail.slice(0, 180)}` : '.'}`;
              }
              if (status === 401) return 'Groq authentication failed. Check the API key.';
              if (status === 403) return 'Groq request is not permitted for this key/model.';
              if (status === 413) return 'Groq request is too large. Reduce context or image size.';
              if (status === 404) return 'Groq model or endpoint was not found. Check the selected model.';
              return `Groq error: ${status}${body ? ` - ${body.slice(0, 180)}` : ''}`;
          }'''
          if old not in s:
              raise SystemExit('formatGroqError block not found')
          s = s.replace(old, new)

          s = s.replace(
              "    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {",
              "    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {",
              2,
          )

          old_loop = '''        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let isFirst = true;
        let finishReason = null;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            logTransportEvent('groq.text.stream_chunk', { chunk });
            const lines = chunk.split('\\n').filter(line => line.trim() !== '');

            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;

                    try {
                        const json = JSON.parse(data);
                        logTransportEvent('groq.text.stream_event', json);
                        finishReason = json.choices?.[0]?.finish_reason || finishReason;
                        const token = json.choices?.[0]?.delta?.content || '';
                        if (token) {
                            fullText += token;
                            const displayText = stripThinkingTags(fullText);
                            if (displayText) {
                                sendToRenderer(isFirst ? 'new-response' : 'update-response', displayText);
                                isFirst = false;
                            }
                        }
                    } catch (parseError) {
                        logTransportEvent('groq.text.stream_parse_error', {
                            data,
                            error: parseError.message,
                        });
                    }
                }
            }
        }
'''
          new_loop = '''        sendGroqRateLimitStatus(response.headers);
        const reader = response.body?.getReader();
        if (!reader) throw new Error('Groq returned no response body for streaming completion.');
        const decoder = new TextDecoder();
        let fullText = '';
        let isFirst = true;
        let finishReason = null;
        let sseBuffer = '';

        while (true) {
            const { done, value } = await reader.read();
            sseBuffer += decoder.decode(value || new Uint8Array(), { stream: !done });
            const events = sseBuffer.split(/\\r?\\n\\r?\\n/);
            sseBuffer = events.pop() || '';

            for (const event of events) {
                const dataLines = event.split(/\\r?\\n/)
                    .filter(line => line.startsWith('data:'))
                    .map(line => line.slice(5).trimStart());
                if (!dataLines.length) continue;
                const data = dataLines.join('\\n').trim();
                if (!data || data === '[DONE]') continue;

                try {
                    const json = JSON.parse(data);
                    logTransportEvent('groq.text.stream_event', json);
                    finishReason = json.choices?.[0]?.finish_reason || finishReason;
                    const token = json.choices?.[0]?.delta?.content || '';
                    if (token) {
                        fullText += token;
                        const displayText = stripThinkingTags(fullText);
                        if (displayText) {
                            sendToRenderer(isFirst ? 'new-response' : 'update-response', displayText);
                            isFirst = false;
                        }
                    }
                } catch (parseError) {
                    logTransportEvent('groq.text.stream_parse_error', { data, error: parseError.message });
                }
            }

            if (done) break;
        }
        if (sseBuffer.trim()) {
            for (const line of sseBuffer.split(/\\r?\\n/)) {
                if (!line.startsWith('data:')) continue;
                const data = line.slice(5).trimStart();
                if (!data || data === '[DONE]') continue;
                try {
                    const json = JSON.parse(data);
                    finishReason = json.choices?.[0]?.finish_reason || finishReason;
                    const token = json.choices?.[0]?.delta?.content || '';
                    if (token) fullText += token;
                } catch (parseError) {
                    logTransportEvent('groq.text.stream_tail_parse_error', { data, error: parseError.message });
                }
            }
        }
'''
          if old_loop not in s:
              raise SystemExit('Groq text streaming loop not found')
          s = s.replace(old_loop, new_loop, 1)

          old_image_loop = '''        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let isFirst = true;
        let finishReason = null;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            logTransportEvent('groq.image.stream_chunk', { chunk });
            const lines = chunk.split('\\n').filter(line => line.trim() !== '');

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;

                const data = line.slice(6);
                if (data === '[DONE]') continue;

                try {
                    const json = JSON.parse(data);
                    logTransportEvent('groq.image.stream_event', json);
                    finishReason = json.choices?.[0]?.finish_reason || finishReason;
                    const token = json.choices?.[0]?.delta?.content || '';
                    if (!token) continue;

                    fullText += token;
                    const displayText = stripThinkingTags(fullText);
                    if (displayText) {
                        sendToRenderer(isFirst ? 'new-response' : 'update-response', displayText);
                        isFirst = false;
                    }
                } catch (parseError) {
                    logTransportEvent('groq.image.stream_parse_error', {
                        data,
                        error: parseError.message,
                    });
                }
            }
        }
'''
          new_image_loop = '''        sendGroqRateLimitStatus(response.headers);
        const reader = response.body?.getReader();
        if (!reader) throw new Error('Groq returned no response body for image streaming.');
        const decoder = new TextDecoder();
        let fullText = '';
        let isFirst = true;
        let finishReason = null;
        let sseBuffer = '';

        while (true) {
            const { done, value } = await reader.read();
            sseBuffer += decoder.decode(value || new Uint8Array(), { stream: !done });
            const events = sseBuffer.split(/\\r?\\n\\r?\\n/);
            sseBuffer = events.pop() || '';
            for (const event of events) {
                const dataLines = event.split(/\\r?\\n/)
                    .filter(line => line.startsWith('data:'))
                    .map(line => line.slice(5).trimStart());
                if (!dataLines.length) continue;
                const data = dataLines.join('\\n').trim();
                if (!data || data === '[DONE]') continue;
                try {
                    const json = JSON.parse(data);
                    logTransportEvent('groq.image.stream_event', json);
                    finishReason = json.choices?.[0]?.finish_reason || finishReason;
                    const token = json.choices?.[0]?.delta?.content || '';
                    if (!token) continue;
                    fullText += token;
                    const displayText = stripThinkingTags(fullText);
                    if (displayText) {
                        sendToRenderer(isFirst ? 'new-response' : 'update-response', displayText);
                        isFirst = false;
                    }
                } catch (parseError) {
                    logTransportEvent('groq.image.stream_parse_error', { data, error: parseError.message });
                }
            }
            if (done) break;
        }
        if (sseBuffer.trim()) {
            for (const line of sseBuffer.split(/\\r?\\n/)) {
                if (!line.startsWith('data:')) continue;
                const data = line.slice(5).trimStart();
                if (!data || data === '[DONE]') continue;
                try {
                    const json = JSON.parse(data);
                    const token = json.choices?.[0]?.delta?.content || '';
                    if (token) fullText += token;
                } catch (parseError) {
                    logTransportEvent('groq.image.stream_tail_parse_error', { data, error: parseError.message });
                }
            }
        }
'''
          if old_image_loop not in s:
              raise SystemExit('Groq image streaming loop not found')
          s = s.replace(old_image_loop, new_image_loop, 1)

          s = s.replace(
              "    logTransportEvent('groq.text.request', {\n        model: modelToUse,\n        transcription,\n    });",
              "    logTransportEvent('groq.text.request', { model: modelToUse, transcription: transcription.slice(0, 4000) });"
          )
          s = s.replace(
              "    logTransportEvent('groq.image.request', {\n        model,\n        prompt,\n        imageBytes: Buffer.byteLength(base64Data, 'base64'),\n    });",
              "    logTransportEvent('groq.image.request', { model, prompt: String(prompt || '').slice(0, 4000), imageBytes: Buffer.byteLength(base64Data, 'base64') });"
          )

          s = s.replace(
              "function initializeNewSession(profile = null, customPrompt = null) {\n    currentSessionId = Date.now().toString();",
              "function initializeNewSession(profile = null, customPrompt = null) {\n    geminiSessionResumptionHandle = null;\n    currentSessionId = Date.now().toString();"
          )

          old_msg = '''                    console.log('----------------', message);
                    logTransportEvent('gemini.live.message', message);

                    // Handle input transcription (what was spoken)'''
          new_msg = '''                    logTransportEvent('gemini.live.message', message);

                    if (message.sessionResumptionUpdate?.token) {
                        geminiSessionResumptionHandle = message.sessionResumptionUpdate.token;
                        logTransportEvent('gemini.live.resumption_handle_updated', { hasHandle: true });
                    } else if (message.sessionResumptionUpdate?.newHandle) {
                        geminiSessionResumptionHandle = message.sessionResumptionUpdate.newHandle;
                        logTransportEvent('gemini.live.resumption_handle_updated', { hasHandle: true });
                    }

                    // Handle input transcription (what was spoken)'''
          if old_msg not in s:
              raise SystemExit('Gemini message header not found')
          s = s.replace(old_msg, new_msg, 1)

          old_output = '''                    if (currentProviderMode !== 'groq' && message.serverContent?.outputTranscription?.text) {
                        const isFirstChunk = messageBuffer === '';
                        messageBuffer += message.serverContent.outputTranscription.text;
                        sendToRenderer(isFirstChunk ? 'new-response' : 'update-response', messageBuffer);
                    }
'''
          new_output = '''                    if (currentProviderMode !== 'groq' && message.serverContent?.outputTranscription?.text) {
                        const isFirstChunk = messageBuffer === '';
                        messageBuffer += message.serverContent.outputTranscription.text;
                        sendToRenderer(isFirstChunk ? 'new-response' : 'update-response', messageBuffer);
                    }

                    for (const part of message.serverContent?.modelTurn?.parts || []) {
                        if (!part?.text) continue;
                        const isFirstChunk = messageBuffer === '';
                        messageBuffer += part.text;
                        if (currentProviderMode !== 'groq') {
                            sendToRenderer(isFirstChunk ? 'new-response' : 'update-response', messageBuffer);
                        }
                    }
'''
          if old_output not in s:
              raise SystemExit('Gemini output transcription block not found')
          s = s.replace(old_output, new_output, 1)

          old_config = '''                tools: enabledTools,
                thinkingConfig: { thinkingLevel: 'minimal' },
                systemInstruction: {
                    parts: [{ text: systemPrompt }],
                },'''
          new_config = '''                tools: enabledTools,
                thinkingConfig: { thinkingLevel: 'minimal' },
                sessionResumption: geminiSessionResumptionHandle ? { handle: geminiSessionResumptionHandle } : {},
                systemInstruction: {
                    parts: [{ text: systemPrompt }],
                },'''
          if old_config not in s:
              raise SystemExit('Gemini session config block not found')
          s = s.replace(old_config, new_config, 1)

          old_reconnect = '''        const session = await initializeGeminiSession(
            sessionParams.apiKey,
            sessionParams.customPrompt,
            sessionParams.profile,
            sessionParams.language,
            true // isReconnect
        );'''
          new_reconnect = '''        const session = await initializeGeminiSession(
            sessionParams.apiKey,
            sessionParams.customPrompt,
            sessionParams.profile,
            sessionParams.language,
            true // isReconnect
        );'''
          if old_reconnect not in s:
              raise SystemExit('Reconnect call not found')
          s = s.replace(old_reconnect, new_reconnect, 1)

          old_fail = '''    // If we still have attempts left, try again
    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {'''
          new_fail = '''    // If resume failed, discard a potentially poisoned resumption handle before the next attempt.
    if (geminiSessionResumptionHandle) {
        geminiSessionResumptionHandle = null;
    }

    // If we still have attempts left, try again
    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {'''
          if old_fail not in s:
              raise SystemExit('Reconnect fallback block not found')
          s = s.replace(old_fail, new_fail, 1)

          s = s.replace(
              "            currentProviderMode = 'groq';\n            geminiSessionRef.current = null;",
              "            if (geminiSessionRef.current) { try { await geminiSessionRef.current.close(); } catch {} }\n            geminiSessionRef.current = null;\n            currentProviderMode = 'groq';"
          )
          s = s.replace(
              "            groqSystemAudioBuffer = Buffer.alloc(0);\n            sendToRenderer('update-status', 'Groq ready');",
              "            groqSystemAudioBuffer = Buffer.alloc(0);\n            groqRequestStartedForTurn = false;\n            sendToRenderer('update-status', 'Groq ready');"
          )
          s = s.replace(
              "                currentProviderMode = 'byok';\n                closeTransportLog();\n                sendToRenderer('update-status', 'Session closed');",
              "                currentProviderMode = 'byok';\n                sessionParams = null;\n                geminiSessionResumptionHandle = null;\n                closeTransportLog();\n                sendToRenderer('update-status', 'Session closed');"
          )

          p.write_text(s)
          PY

          node --check src/utils/gemini.js

      - name: Commit provider fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No provider changes were necessary."
            exit 0
          fi
          git add src/utils/gemini.js
          git commit -m "phase1: apply provider fixes"
          git push origin HEAD:phase-1-complete-fixes
