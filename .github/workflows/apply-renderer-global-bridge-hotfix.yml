name: Apply renderer global bridge hotfix

on:
  push:
    branches:
      - hotfix/settings-smoke-save-states

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Repair classic-to-module renderer API bridge
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const rendererPath = 'src/utils/renderer.js';
          let renderer = fs.readFileSync(rendererPath, 'utf8');
          const oldDeclaration = '// Consolidated contextHalo object - all functions in one place\nconst contextHalo = {';
          const newDeclaration = '// Consolidated contextHalo object - all functions in one place\n// This file is a classic script while the Lit UI is loaded as ES modules. Use var so\n// the renderer API is a true global binding that module code can resolve reliably.\nvar contextHalo = {';
          if (!renderer.includes(oldDeclaration)) throw new Error('Expected contextHalo declaration was not found.');
          renderer = renderer.replace(oldDeclaration, newDeclaration);
          fs.writeFileSync(rendererPath, renderer);

          const testPath = 'tests/renderer-global-bridge.test.js';
          fs.writeFileSync(testPath, `const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          test('classic renderer exposes contextHalo as a global binding for ES-module UI code', () => {
              const source = fs.readFileSync('src/utils/renderer.js', 'utf8');
              assert.match(source, /var contextHalo = \\{/);
              assert.match(source, /window\\.contextHalo = contextHalo;/);
              assert.doesNotMatch(source, /const contextHalo = \\{/);
          });
          `);
          NODE

      - name: Validate repair
        run: |
          node scripts/check-source.js
          node --test tests/renderer-global-bridge.test.js tests/ui-save-feedback.test.js

      - name: Remove one-time workflow
        run: git rm .github/workflows/apply-renderer-global-bridge-hotfix.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/renderer.js tests/renderer-global-bridge.test.js
          git commit -m "fix: expose renderer API to ES-module views"
          git push origin HEAD:hotfix/settings-smoke-save-states
