name: Apply Settings render diagnostics

on:
  push:
    branches:
      - fix/gemini-screen-reliability
    paths:
      - .github/workflows/apply-settings-render-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/gemini-screen-reliability
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply diagnostics
        run: node .github/repair-data/instrument-settings-render.cjs
      - name: Validate source syntax
        run: node --check scripts/renderer-behavior-smoke.js
      - name: Remove one-time machinery
        run: |
          rm -f .github/repair-data/instrument-settings-render.cjs
          rm -f .github/workflows/apply-settings-render-diagnostics.yml
          rm -f .github/workflows/diagnose-settings-render.yml
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: expose mounted Settings render failure"
          git push origin HEAD:fix/gemini-screen-reliability
