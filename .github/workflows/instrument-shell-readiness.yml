name: Instrument shell readiness checkpoints

on:
  push:
    branches:
      - fix/gemini-screen-reliability
    paths:
      - .github/workflows/instrument-shell-readiness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/gemini-screen-reliability
          fetch-depth: 0
      - name: Add shell readiness diagnostics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/renderer-behavior-smoke.js';
          let s = fs.readFileSync(file, 'utf8');
          const pairs = [
            ["                    await customElements.whenDefined('customize-view');\n\n                    const mainView", "                    await customElements.whenDefined('customize-view');\n                    console.log('[Smoke stage] shell-elements-defined');\n\n                    const mainView"],
            ["                    const errorReady = Boolean(mainView.shadowRoot?.querySelector('.session-status.error'));", "                    const errorReady = Boolean(mainView.shadowRoot?.querySelector('.session-status.error'));\n                    console.log('[Smoke stage] shell-main-ready');"],
            ["                    settingsView.remove();\n\n                    const app", "                    settingsView.remove();\n                    console.log('[Smoke stage] shell-detached-settings-ready-' + settingsReady);\n\n                    const app"],
            ["                    await app.updateComplete;\n                    const content", "                    await app.updateComplete;\n                    console.log('[Smoke stage] shell-app-main-ready');\n                    const content"],
            ["                    await new Promise(resolve => requestAnimationFrame(resolve));\n                    if (content) content.scrollTop = content.scrollHeight;", "                    await new Promise(resolve => requestAnimationFrame(resolve));\n                    console.log('[Smoke stage] shell-main-frame');\n                    if (content) content.scrollTop = content.scrollHeight;"],
            ["                    await app.updateComplete;\n                    await new Promise(resolve => requestAnimationFrame(resolve));\n                    const settingsInApp", "                    await app.updateComplete;\n                    console.log('[Smoke stage] shell-customize-app-update');\n                    await new Promise(resolve => requestAnimationFrame(resolve));\n                    console.log('[Smoke stage] shell-customize-frame');\n                    const settingsInApp"],
            ["                    const unifiedPage = settingsInApp?.shadowRoot?.querySelector('.unified-page');", "                    console.log('[Smoke stage] shell-mounted-settings-ready-' + settingsReady);\n                    const unifiedPage = settingsInApp?.shadowRoot?.querySelector('.unified-page');"],
            ["    const timeout = setTimeout(() => finish(false, 'renderer did not become ready within 120 seconds'), 120000);", "    const timeout = setTimeout(() => finish(false, 'renderer did not become ready within diagnostic 20 seconds'), 20000);"]
          ];
          for (const [from,to] of pairs) {
            if (!s.includes(from)) throw new Error('Marker not found: ' + from.slice(0,100));
            s = s.replace(from,to);
          }
          fs.writeFileSync(file,s);
          NODE
      - run: npm run check
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/instrument-shell-readiness.yml
          git add scripts/renderer-behavior-smoke.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: pinpoint shell readiness stall"
          git push origin HEAD:fix/gemini-screen-reliability
