name: Apply Settings smoke re-query repair

on:
  push:
    branches:
      - fix/gemini-screen-reliability
    paths:
      - .github/workflows/apply-settings-smoke-requery.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/gemini-screen-reliability
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply deterministic Settings probe repair
        run: node .github/repair-data/settings-smoke-requery.cjs
      - name: Validate patched source syntax
        run: node --check scripts/renderer-behavior-smoke.js
      - name: Remove one-time repair machinery
        run: |
          rm -f .github/repair-data/settings-smoke-requery.cjs
          rm -f .github/workflows/apply-settings-smoke-requery.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/renderer-behavior-smoke.js .github/repair-data/settings-smoke-requery.cjs .github/workflows/apply-settings-smoke-requery.yml
          git commit -m "test: re-query mounted Settings during Electron smoke"
          git push origin HEAD:fix/gemini-screen-reliability
