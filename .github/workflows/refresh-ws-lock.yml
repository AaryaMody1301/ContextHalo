name: Refresh ws dependency lock

on:
  push:
    branches:
      - fix/ws-security-update
    paths:
      - .github/workflows/refresh-ws-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ws-security-update
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Update ws and validate
        shell: bash
        run: |
          npm install 'ws@^8.21.3' --save
          npm run check
          npm test
      - name: Commit generated lockfile update
        shell: bash
        run: |
          rm .github/workflows/refresh-ws-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build(deps): update ws to 8.21.3'
          git push origin HEAD:fix/ws-security-update
