name: Apply Gemini screen reliability patch

on:
  push:
    branches: [fix/gemini-screen-reliability]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/gemini-screen-reliability

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Apply production patch
        run: node scripts/apply-gemini-screen-reliability.cjs

      - name: Validate source syntax
        run: |
          node --check src/utils/gemini.js
          node --check src/utils/renderer.js
          node --check src/utils/geminiScreenReliability.js
          node --check tests/gemini-screen-reliability.test.js

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Remove one-time patch machinery
        run: rm -f scripts/apply-gemini-screen-reliability.cjs .github/workflows/apply-gemini-screen-reliability.yml

      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Gemini screen analysis deadlines" || exit 0
          git push origin HEAD:fix/gemini-screen-reliability
