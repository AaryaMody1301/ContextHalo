name: Instrument renderer smoke stages

on:
  push:
    branches:
      - fix/gemini-screen-reliability
    paths:
      - .github/workflows/instrument-renderer-smoke.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/gemini-screen-reliability
          fetch-depth: 0
      - name: Add bounded smoke progress diagnostics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/renderer-behavior-smoke.js';
          let s = fs.readFileSync(file, 'utf8');
          const replacements = [
            ["    const api = window.contextHalo;\n    await waitUntil(()=>app._storageLoaded);", "    const api = window.contextHalo;\n    const stage = value => { window.__contextHaloSmokeStage = value; console.log('[Smoke stage] ' + value); };\n    stage('renderer-start');\n    await waitUntil(()=>app._storageLoaded);"],
            ["    const ipc=window.electronAPI;", "    stage('knowledge');\n    const ipc=window.electronAPI;"],
            ["    const sessionId='1234567890123';", "    stage('history');\n    const sessionId='1234567890123';"],
            ["    const previousLayout = app.layoutMode;", "    stage('layout');\n    const previousLayout = app.layoutMode;"],
            ["    for (const id of ['phase4-knowledge-nav','phase4-practice-nav','phase4-review-nav']) {", "    stage('workspaces');\n    for (const id of ['phase4-knowledge-nav','phase4-practice-nav','phase4-review-nav']) {"],
            ["    // Real native controls and isolated provider attribution; no external account needed.", "    stage('grounding');\n    // Real native controls and isolated provider attribution; no external account needed."],
            ["    app.navigate('customize'); await settle(app);\n    const settings = app.shadowRoot.querySelector('customize-view');", "    stage('settings');\n    app.navigate('customize'); await settle(app);\n    const settings = app.shadowRoot.querySelector('customize-view');"],
            ["    for (const page of ['main','customize','ai-customize','history','help','feedback','onboarding']) {", "    stage('form-labels');\n    for (const page of ['main','customize','ai-customize','history','help','feedback','onboarding']) {"],
            ["    app.navigate('assistant'); await settle(app);\n    const reading = app.shadowRoot.querySelector('assistant-view');", "    stage('reading');\n    app.navigate('assistant'); await settle(app);\n    const reading = app.shadowRoot.querySelector('assistant-view');"],
            ["    return checks;\n}", "    stage('renderer-complete');\n    return checks;\n}"],
            ["        if (message.level === 'error' || message.level === 3) rendererErrors.push(String(message.message).slice(0, 2000));", "        if (String(message.message || '').startsWith('[Smoke stage]')) console.log(String(message.message));\n        if (message.level === 'error' || message.level === 3) rendererErrors.push(String(message.message).slice(0, 2000));"],
            ["            if (!ready) throw new Error(`unexpected renderer state ${JSON.stringify(result)}`);\n            \n            const checks", "            if (!ready) throw new Error(`unexpected renderer state ${JSON.stringify(result)}`);\n            console.log('[Windows smoke] shell ready ' + JSON.stringify(result));\n            \n            const checks"]
          ];
          for (const [from, to] of replacements) {
            if (!s.includes(from)) throw new Error('Instrumentation marker not found: ' + from.slice(0,80));
            s = s.replace(from, to);
          }
          fs.writeFileSync(file, s);
          NODE
      - run: npm run check
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/instrument-renderer-smoke.yml
          git add scripts/renderer-behavior-smoke.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: expose renderer smoke progress stages"
          git push origin HEAD:fix/gemini-screen-reliability
