name: Apply Sep 15 Groq reasoning repair

on:
  push:
    branches: [fix/sep15-live-api-audit]

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/sep15-live-api-audit

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Apply exact provider repair
        shell: pwsh
        run: |
          if (Test-Path scripts/apply-sep15-groq-reasoning.cjs) {
            node scripts/apply-sep15-groq-reasoning.cjs
          } else {
            Write-Host 'Repair already applied.'
          }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate repaired source
        run: |
          npm run check
          npm test

      - name: Commit repaired tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          if (git diff --cached --quiet) {
            Write-Host 'No repair changes to commit.'
            exit 0
          }
          git commit -m "fix: make Qwen reasoning mode explicit"
          git push origin HEAD:fix/sep15-live-api-audit
