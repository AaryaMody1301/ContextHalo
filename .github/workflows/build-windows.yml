name: Build ContextHalo Windows Portable EXE
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contexthalo-windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/typed-session-input-ui-model-guard'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply visual acceptance corrections
        run: python .github/finish-repair.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate JavaScript
        run: npm run check
      - name: Run all regression tests
        run: npm test
      - name: Run real Electron behavior and geometry tests
        shell: pwsh
        run: |
          & ".\node_modules\.bin\electron.cmd" . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Electron behavior smoke failed: $LASTEXITCODE" }
      - name: Build portable Windows EXE
        run: npm run build:portable -- --publish never
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-Item dist/ContextHalo-Windows-x64.exe
          if ($exe.Length -lt 1MB) { throw "Invalid portable EXE" }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Behavior-Evidence
          path: qa-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload validated executable
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Windows-x64-Portable
          path: dist/ContextHalo-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated visual and packaging fixes
        shell: pwsh
        run: |
          git config user.name "ContextHalo validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests scripts package.json
          git rm -- .github/finish-repair.py
          git commit -m "fix: improve HUD reading space, navigation and window restoration"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit validated repair" }
          git push origin HEAD:refs/heads/fix/typed-session-input-ui-model-guard
          if ($LASTEXITCODE -ne 0) { throw "Repair branch changed; refusing to overwrite it" }
