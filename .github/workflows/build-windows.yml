name: Build ContextHalo Windows Portable EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contexthalo-windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ContextHalo Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      release_tag: ${{ steps.release_metadata.outputs.tag }}
      release_version: ${{ steps.release_metadata.outputs.version }}
      app_version: ${{ steps.release_metadata.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload validation source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ContextHalo-Validation-Source
          path: |
            src/
            tests/
            scripts/
            docs/
            preload.js
            package.json
            package-lock.json
            README.md
            AGENTS.md
            LICENSE
            CREDITS.md
            THIRD_PARTY_NOTICES.md
            docs/PHASE_1_FILE_INVENTORY.json
            docs/THIRD_PARTY_PROVENANCE.json
          if-no-files-found: error
          retention-days: 7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Resolve release metadata
        id: release_metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "package.json version must be numeric semantic version" }
          $appVersion = "$version-portable.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify lockfile is in sync
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --dry-run

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        shell: pwsh
        run: |
          $env:npm_config_fetch_timeout = "60000"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm audit --omit=dev --audit-level=high
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          throw "Production dependency audit failed after 3 attempts."

      - name: Run source validation
        run: npm run check

      - name: Run all regression tests
        run: npm test

      - name: Run Electron behavior and layout smoke test
        shell: pwsh
        run: |
          & ".\node_modules\.bin\electron.cmd" . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Electron behavior smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Build portable Windows EXE
        run: npm run build:portable -- --publish never "-c.extraMetadata.version=${{ steps.release_metadata.outputs.app_version }}" "-c.extraMetadata.releaseBuild=${{ github.run_number }}" "-c.extraMetadata.releaseTag=${{ steps.release_metadata.outputs.tag }}" "-c.extraMetadata.releaseCommit=${{ github.sha }}"

      - name: Verify portable EXE and record checksum
        shell: pwsh
        run: |
          $exe = Get-Item "dist/ContextHalo-Windows-x64.exe"
          if ($exe.Length -lt 1MB) { throw "Portable EXE is unexpectedly small." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ContextHalo-Windows-x64.exe" | Set-Content -Encoding utf8 "dist/SHA256SUMS.txt"
          Write-Host "Portable EXE SHA-256: $hash"

      - name: Launch portable EXE at 100, 125, 150 and 200 percent Chromium scale
        shell: pwsh
        run: |
          $exe = (Get-Item "dist/ContextHalo-Windows-x64.exe").FullName
          try {
            foreach ($scale in @('1', '1.25', '1.5', '2')) {
              $directory = Join-Path $env:GITHUB_WORKSPACE "qa-results/portable-$scale"
              New-Item -ItemType Directory -Force -Path $directory | Out-Null
              $env:CONTEXTHALO_QA_DIR = $directory
              $process = Start-Process -FilePath $exe -ArgumentList @('--ci-smoke-test', "--force-device-scale-factor=$scale") -PassThru
              $outcomePath = Join-Path $directory 'outcome.json'
              $deadline = (Get-Date).AddSeconds(150)
              while (!(Test-Path $outcomePath) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
              if (!(Test-Path $outcomePath)) {
                if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
                throw "Packaged smoke timed out at Chromium scale $scale"
              }
              $outcome = Get-Content -Raw $outcomePath | ConvertFrom-Json
              $outcome | ConvertTo-Json -Depth 8 | Write-Host
              if (!$outcome.success -or !$outcome.packaged -or $outcome.platform -ne 'win32' -or $outcome.arch -ne 'x64') {
                throw "Packaged smoke failed at Chromium scale $scale"
              }
              if ($outcome.version -ne "${{ steps.release_metadata.outputs.app_version }}" -or $outcome.releaseTag -ne "${{ steps.release_metadata.outputs.tag }}" -or $outcome.releaseCommit -ne "${{ github.sha }}") {
                throw "Packaged release provenance does not match this workflow run"
              }
              if (!$process.WaitForExit(15000)) { Stop-Process -Id $process.Id -Force; throw 'Portable launcher did not exit after smoke completion' }
            }
          } finally {
            Remove-Item Env:CONTEXTHALO_QA_DIR -ErrorAction SilentlyContinue
          }

      - name: Attest validated release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/ContextHalo-Windows-x64.exe
            dist/SHA256SUMS.txt

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ContextHalo-Behavior-Evidence
          path: qa-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ContextHalo-Windows-x64-Portable
          path: |
            dist/ContextHalo-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish ContextHalo GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download portable EXE
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ContextHalo-Windows-x64-Portable
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ContextHalo Windows Portable Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/ContextHalo-Windows-x64.exe
            release/SHA256SUMS.txt

      - name: Verify published release identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($release.target_commitish -ne "${{ github.sha }}") { throw "Published release target does not match workflow commit" }
          foreach ($name in @('ContextHalo-Windows-x64.exe', 'SHA256SUMS.txt')) {
            $asset = @($release.assets | Where-Object { $_.name -eq $name })
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].digest -notmatch '^sha256:[a-f0-9]{64}$') {
              throw "Published release asset metadata is incomplete for $name"
            }
          }
          if (!$release.immutable) {
            Write-Warning "Repository immutable releases are not enabled yet; apply docs/PHASE_8_REPOSITORY_GOVERNANCE.json with an Administration token."
          }
