name: Build ContextHalo Windows Portable EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the files from a verified Windows candidate on main
        type: boolean
        default: false
      candidate_run_id:
        description: Successful Windows candidate run ID required when publishing
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: >-
    contexthalo-windows-portable-${{ github.workflow }}-${{ github.ref }}-${{
    github.event_name == 'workflow_dispatch' && inputs.publish == true && 'release' || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-check:
    name: Check ContextHalo source and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Determine pull request validation scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/pr-validation-scope.js

      - name: Verify lockfile and dependency provenance
        run: node --test tests/repository-provenance.test.js

      - name: Run source validation
        run: npm run check

      - name: Check repository policy and branding
        if: steps.scope.outputs.scope == 'source'
        run: node --test tests/repository-governance.test.js tests/brand.test.js

  build:
    name: Build ContextHalo Windows x64 EXE
    needs: source-check
    if: needs.source-check.outputs.scope != 'source' && !(github.event_name == 'workflow_dispatch' && inputs.publish == true)
    env:
      BUILD_PORTABLE: ${{ needs.source-check.outputs.scope != 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Upload validation source snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ContextHalo-Validation-Source
          path: |
            src/
            tests/
            scripts/
            docs/
            preload.js
            package.json
            package-lock.json
            README.md
            AGENTS.md
            LICENSE
            CREDITS.md
            THIRD_PARTY_NOTICES.md
            docs/PHASE_1_FILE_INVENTORY.json
            docs/THIRD_PARTY_PROVENANCE.json
          if-no-files-found: error
          retention-days: 7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Resolve release metadata
        if: env.BUILD_PORTABLE == 'true'
        id: release_metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "package.json version must be numeric semantic version" }
          $appVersion = "$version-portable.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify lockfile is in sync
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --dry-run

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit locked dependencies
        shell: pwsh
        run: |
          $env:npm_config_fetch_timeout = "60000"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm audit --audit-level=high
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          throw "Locked dependency audit failed after 3 attempts."

      - name: Run all regression tests
        shell: pwsh
        run: |
          npm test | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'contexthalo-tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare synthetic retrieval performance
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: pwsh
        run: |
          $benchmarkPaths = @(
            'scripts/phase4-performance.js',
            'src/storage.js',
            'src/utils/knowledgeCore.js',
            'src/utils/knowledgeStore.js',
            'src/utils/knowledgeRagMain.js',
            'src/utils/providerRequestMain.js',
            'src/utils/realtimeContextCore.js',
            'src/utils/sessionPackMain.js'
          )
          $changed = @(git diff --name-only $env:PR_BASE_SHA HEAD -- @benchmarkPaths)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect benchmark changes" }
          if (!$changed) {
            Write-Host "No retrieval, request-composition, or History changes. Skipping the comparison."
            return
          }

          $baseline = Join-Path $env:RUNNER_TEMP 'contexthalo-perf-base'
          git worktree add --detach $baseline $env:PR_BASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the performance baseline" }
          New-Item -ItemType Directory -Force -Path 'qa-results' | Out-Null
          $before = node --expose-gc scripts/phase4-performance.js $baseline | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Baseline benchmark failed" }
          $after = node --expose-gc scripts/phase4-performance.js | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Updated benchmark failed" }
          $before | Set-Content 'qa-results/phase4-before.json' -Encoding utf8
          $after | Set-Content 'qa-results/phase4-after.json' -Encoding utf8
          Write-Host "[Phase 4 before] $(ConvertTo-Json (ConvertFrom-Json $before) -Depth 12 -Compress)"
          Write-Host "[Phase 4 after] $(ConvertTo-Json (ConvertFrom-Json $after) -Depth 12 -Compress)"
          $baseResults = (ConvertFrom-Json $before).results
          $updatedResults = (ConvertFrom-Json $after).results
          for ($i = 0; $i -lt $baseResults.Count; $i++) {
            if ($baseResults[$i].corpusBytes -ne $updatedResults[$i].corpusBytes -or
                $baseResults[$i].rankingSha256 -ne $updatedResults[$i].rankingSha256) {
              throw "Synthetic corpus or ranked result changed"
            }
          }

      - name: Run Electron behavior and layout smoke test
        shell: pwsh
        run: |
          & ".\node_modules\.bin\electron.cmd" . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Electron behavior smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Build portable Windows EXE
        if: env.BUILD_PORTABLE == 'true'
        run: npm run build:portable -- --publish never "-c.extraMetadata.version=${{ steps.release_metadata.outputs.app_version }}" "-c.extraMetadata.releaseBuild=${{ github.run_number }}" "-c.extraMetadata.releaseTag=${{ steps.release_metadata.outputs.tag }}" "-c.extraMetadata.releaseCommit=${{ github.sha }}"

      - name: Verify portable EXE and record checksum
        if: env.BUILD_PORTABLE == 'true'
        id: portable_checksum
        shell: pwsh
        run: |
          $exe = Get-Item "dist/ContextHalo-Windows-x64.exe"
          if ($exe.Length -lt 1MB) { throw "Portable EXE is unexpectedly small." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ContextHalo-Windows-x64.exe" | Set-Content -Encoding utf8 "dist/SHA256SUMS.txt"
          "sha256=$hash" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "Portable EXE SHA-256: $hash"

      - name: Record portable EXE Authenticode state
        if: env.BUILD_PORTABLE == 'true'
        shell: pwsh
        run: |
          $exe = (Get-Item "dist/ContextHalo-Windows-x64.exe").FullName
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          $status = [string]$signature.Status
          $subject = if ($signature.SignerCertificate) { [string]$signature.SignerCertificate.Subject } else { $null }
          New-Item -ItemType Directory -Force -Path "qa-results/release" | Out-Null
          [ordered]@{
            status = $status
            signerSubject = $subject
            appVersion = "${{ steps.release_metadata.outputs.app_version }}"
            releaseTag = "${{ steps.release_metadata.outputs.tag }}"
            releaseCommit = "${{ github.sha }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 "qa-results/release/authenticode.json"
          Write-Host "Portable EXE Authenticode status: $status"
          if ($status -notin @('Valid', 'NotSigned')) {
            throw "Portable EXE has an invalid Authenticode state: $status"
          }

      - name: Launch portable EXE at 100, 125, 150 and 200 percent Chromium scale
        if: env.BUILD_PORTABLE == 'true'
        shell: pwsh
        env:
          TESTED_EXE_SHA256: ${{ steps.portable_checksum.outputs.sha256 }}
        run: |
          $exe = (Get-Item "dist/ContextHalo-Windows-x64.exe").FullName
          try {
            foreach ($scale in @('1', '1.25', '1.5', '2')) {
              if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:TESTED_EXE_SHA256) {
                throw "Portable EXE hash changed before the $scale smoke launch"
              }
              $directory = Join-Path $env:GITHUB_WORKSPACE "qa-results/portable-$scale"
              New-Item -ItemType Directory -Force -Path $directory | Out-Null
              $env:CONTEXTHALO_QA_DIR = $directory
              $env:CONTEXTHALO_ACCEPTANCE_DIR = Join-Path $directory 'reliability'
              $env:CONTEXTHALO_ACCEPTANCE_SAMPLE_MS = '10000'
              $process = Start-Process -FilePath $exe -ArgumentList @('--ci-smoke-test', '--reliability-acceptance', "--force-device-scale-factor=$scale") -PassThru
              $outcomePath = Join-Path $directory 'outcome.json'
              $deadline = (Get-Date).AddSeconds(150)
              while (!(Test-Path $outcomePath) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
              if (!(Test-Path $outcomePath)) {
                if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
                throw "Packaged smoke timed out at Chromium scale $scale"
              }
              $outcome = Get-Content -Raw $outcomePath | ConvertFrom-Json
              $outcome | ConvertTo-Json -Depth 8 | Write-Host
              if (!$outcome.success -or !$outcome.packaged -or $outcome.platform -ne 'win32' -or $outcome.arch -ne 'x64') {
                throw "Packaged smoke failed at Chromium scale $scale"
              }
              if ($outcome.version -ne "${{ steps.release_metadata.outputs.app_version }}" -or $outcome.releaseTag -ne "${{ steps.release_metadata.outputs.tag }}" -or $outcome.releaseCommit -ne "${{ github.sha }}") {
                throw "Packaged release provenance does not match this workflow run"
              }
              if (!$process.WaitForExit(15000)) { Stop-Process -Id $process.Id -Force; throw 'Portable launcher did not exit after smoke completion' }

              $reliabilitySummaryPath = Join-Path $env:CONTEXTHALO_ACCEPTANCE_DIR 'summary.json'
              $reliabilityMetadataPath = Join-Path $env:CONTEXTHALO_ACCEPTANCE_DIR 'metadata.json'
              if (!(Test-Path $reliabilitySummaryPath) -or !(Test-Path $reliabilityMetadataPath)) {
                throw "Packaged reliability evidence was not written at Chromium scale $scale"
              }
              $reliabilitySummary = Get-Content -Raw $reliabilitySummaryPath | ConvertFrom-Json
              $reliabilityMetadata = Get-Content -Raw $reliabilityMetadataPath | ConvertFrom-Json
              if ($reliabilitySummary.sampleCount -lt 1 -or !$reliabilitySummary.endedAt) {
                throw "Packaged reliability recorder did not finalize at Chromium scale $scale"
              }
              if ($reliabilityMetadata.appVersion -ne "${{ steps.release_metadata.outputs.app_version }}" -or $reliabilityMetadata.release.tag -ne "${{ steps.release_metadata.outputs.tag }}") {
                throw "Reliability evidence provenance does not match the packaged release"
              }
            }
          } finally {
            Remove-Item Env:CONTEXTHALO_QA_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:CONTEXTHALO_ACCEPTANCE_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:CONTEXTHALO_ACCEPTANCE_SAMPLE_MS -ErrorAction SilentlyContinue
          }

      - name: Record verified release candidate
        if: env.BUILD_PORTABLE == 'true'
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ steps.release_metadata.outputs.tag }}
          TESTED_EXE_SHA256: ${{ steps.portable_checksum.outputs.sha256 }}
        run: node scripts/verify-windows-release.js record dist qa-results (Join-Path $env:RUNNER_TEMP 'contexthalo-tests.log')

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ContextHalo-Behavior-Evidence
          path: qa-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload portable EXE artifact
        if: env.BUILD_PORTABLE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ContextHalo-Windows-x64-Portable
          path: |
            dist/ContextHalo-Windows-x64.exe
            dist/SHA256SUMS.txt
            dist/release-candidate.json
          if-no-files-found: error
          retention-days: 90

  attest-release:
    name: Attest ContextHalo Windows release
    needs: source-check
    if: github.repository == 'AaryaMody1301/ContextHalo' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      run_number: ${{ steps.candidate.outputs.run_number }}
      release_tag: ${{ steps.files.outputs.tag }}
      release_commit: ${{ steps.files.outputs.commit }}
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Select verified main candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: node scripts/verify-windows-release.js select "$CANDIDATE_RUN_ID"

      - name: Download validated portable EXE
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: release

      - name: Verify candidate files before attestation
        id: files
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_NUMBER: ${{ steps.candidate.outputs.run_number }}
        run: node scripts/verify-windows-release.js check-files release/release-candidate.json

      - name: Attest validated release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/ContextHalo-Windows-x64.exe
            release/SHA256SUMS.txt

  publish-release:
    name: Publish ContextHalo GitHub Release
    needs: attest-release
    if: github.repository == 'AaryaMody1301/ContextHalo' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release verifier and notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download portable EXE
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.attest-release.outputs.artifact_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: release

      - name: Verify candidate files and existing tag before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_NUMBER: ${{ needs.attest-release.outputs.run_number }}
        run: |
          node scripts/verify-windows-release.js check-files release/release-candidate.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-windows-release.js preflight release/release-candidate.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.attest-release.outputs.release_tag }}
          name: ContextHalo Windows Portable ${{ needs.attest-release.outputs.release_tag }}
          target_commitish: ${{ needs.attest-release.outputs.release_commit }}
          body_path: ${{ startsWith(needs.attest-release.outputs.release_tag, 'v0.9.0-portable.') && 'docs/PHASE_10_V0_9_RELEASE_NOTES.md' || '' }}
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release/ContextHalo-Windows-x64.exe
            release/SHA256SUMS.txt

      - name: Verify published release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-windows-release.js verify release/release-candidate.json

  maintain-release:
    name: Maintain ContextHalo after release
    needs: publish-release
    uses: ./.github/workflows/repository-maintenance.yml
    permissions:
      contents: write
      pull-requests: read
    with:
      apply: true
