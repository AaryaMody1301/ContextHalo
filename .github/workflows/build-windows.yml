name: Build ContextHalo Windows Portable EXE
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contexthalo-windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/typed-session-input-ui-model-guard'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Preserve transfer for byte-for-byte verification
        uses: actions/upload-artifact@v4
        with:
          name: Repair-Transfer-Verification
          path: .github/repair-transfer-*.b64
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Apply checksum-verified source repair
        shell: python
        run: |
          import base64, gzip, hashlib, json
          from pathlib import Path
          parts = [Path(f'.github/repair-transfer-{i}.b64').read_text().strip() for i in range(4)]
          for i, part in enumerate(parts):
              print('Transfer part', i, 'length', len(part), 'sha256', hashlib.sha256(part.encode()).hexdigest())
          data = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(data).hexdigest() == 'aff396112a6d0d37d3b9294a80e8af5fb8f47d1f69a5f5e8e1841504e2489b13', 'Repair checksum mismatch'
          pending = []
          for item in json.loads(data):
              name = item['path']
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name in ['package.json', 'preload.js', 'README.md'] or name.startswith(('src/', 'tests/', 'scripts/', 'docs/'))
              old = path.read_bytes().replace(b'\r\n', b'\n') if path.exists() else b''
              if item['before'] is None:
                  assert not path.exists(), 'New path already exists: ' + name
              else:
                  assert hashlib.sha256(old).hexdigest() == item['before'], 'Source changed: ' + name
              for start, end, text in reversed(item['edits']):
                  assert 0 <= start <= end <= len(old)
                  old = old[:start] + text.encode('utf-8') + old[end:]
              pending.append((path, item['delete'], old))
          for path, delete, content in pending:
              if delete: path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
          print('Applied', len(pending), 'verified source changes')
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate JavaScript
        run: npm run check
      - name: Run all regression tests
        run: npm test
      - name: Run real Electron behavior and IPC tests
        shell: pwsh
        run: |
          & ".\node_modules\.bin\electron.cmd" . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Electron behavior smoke failed: $LASTEXITCODE" }
      - name: Build portable Windows EXE
        run: npm run build:portable -- --publish never
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-Item dist/ContextHalo-Windows-x64.exe
          if ($exe.Length -lt 1MB) { throw "Invalid portable EXE" }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Behavior-Evidence
          path: qa-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload validated executable
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Windows-x64-Portable
          path: dist/ContextHalo-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Commit only validated source changes to the repair branch
        shell: pwsh
        run: |
          git config user.name "ContextHalo validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests scripts docs README.md package.json preload.js
          git rm -- .github/repair-transfer-0.b64 .github/repair-transfer-1.b64 .github/repair-transfer-2.b64 .github/repair-transfer-3.b64
          git commit -m "fix: repair session requests, UI, persistence and security with behavioral regression tests"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit validated repair" }
          git push origin HEAD:refs/heads/fix/typed-session-input-ui-model-guard
          if ($LASTEXITCODE -ne 0) { throw "Repair branch changed; refusing to overwrite it" }
