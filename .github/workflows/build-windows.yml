name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Package Windows application
        shell: pwsh
        run: npm run package -- --platform=win32 --arch=x64
      - name: Publish packaged app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path out\cheating-daddy-win32-x64\* -DestinationPath release\Cheating-Daddy-Windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheating-Daddy-Windows-x64
          path: release/Cheating-Daddy-Windows-x64.zip
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0-build.${{ github.run_number }}
          name: Cheating Daddy Windows Build ${{ github.run_number }}
          files: release/Cheating-Daddy-Windows-x64.zip
