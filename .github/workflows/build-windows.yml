name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Refresh dependency lockfile
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- package-lock.json)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh package lockfile"
            git push
          }

      - name: Install dependencies
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Syntax check
        shell: pwsh
        run: node --check src/utils/gemini.js

      - name: Build Windows installer
        shell: pwsh
        run: npm run make

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "out\make" -Recurse -File -Include *.exe
          if ($files.Count -lt 1) {
            throw "No Windows installer was produced."
          }
          $files | ForEach-Object { Write-Host "Built: $($_.FullName)" }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: cheating-daddy-windows-x64
          path: |
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/RELEASES
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.repository.updated_at && github.run_number }}
          name: Windows Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/RELEASES
