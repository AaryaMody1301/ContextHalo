name: Build ContextHalo Windows Portable EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contexthalo-windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ContextHalo Windows x64 EXE
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Verify lockfile is in sync
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --dry-run

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Run source validation
        shell: pwsh
        run: npm run check

      - name: Run tests
        shell: pwsh
        run: npm test --if-present

      - name: Run Electron renderer smoke test
        shell: pwsh
        run: |
          & ".\node_modules\.bin\electron.cmd" . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Electron renderer smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Build portable Windows EXE
        shell: pwsh
        run: npm run build:portable -- --publish never

      - name: Verify portable EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -File -Filter "ContextHalo-Windows-x64.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Contents of dist/:"
            Get-ChildItem -Path "dist" -Recurse | Select-Object FullName, Length
            throw "Portable Windows EXE was not produced."
          }
          Write-Host "Portable EXE: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Windows-x64-Portable
          path: dist/ContextHalo-Windows-x64.exe
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish ContextHalo GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download portable EXE
        uses: actions/download-artifact@v5
        with:
          name: ContextHalo-Windows-x64-Portable
          path: release

      - name: Remove stale pre-ContextHalo releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $legacyProductFirst = -join (67, 104, 101, 97, 116, 105, 110, 103 | ForEach-Object { [char]$_ })
          $legacyProductSecond = -join (68, 97, 100, 100, 121 | ForEach-Object { [char]$_ })
          $legacyRepoA = -join (85, 112, 100, 97, 116, 101, 100, 95, 80, 117, 98, 108, 105, 99, 95, 82, 101, 112, 111 | ForEach-Object { [char]$_ })
          $legacyRepoB = -join (76, 105, 118, 101, 95, 72, 101, 108, 112, 101, 114 | ForEach-Object { [char]$_ })
          $pattern = "(?i)$([regex]::Escape($legacyProductFirst))[ _-]?$([regex]::Escape($legacyProductSecond))|$([regex]::Escape($legacyRepoA))|$([regex]::Escape($legacyRepoB))"
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in $releases) {
            $assetNames = ($release.assets | ForEach-Object { $_.name }) -join ' '
            $searchText = "$($release.name)`n$($release.body)`n$assetNames"
            if ($searchText -match $pattern) {
              Write-Host "Deleting stale release id $($release.id)"
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
            }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0-portable.${{ github.run_number }}
          name: ContextHalo Windows Portable Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/ContextHalo-Windows-x64.exe
