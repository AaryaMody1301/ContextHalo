name: Build ContextHalo Windows Portable EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contexthalo-windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ContextHalo Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Upload validation source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Validation-Source
          path: |
            src/
            tests/
            scripts/
            docs/
            preload.js
            package.json
            package-lock.json
            README.md
            AGENTS.md
            LICENSE
            CREDITS.md
          if-no-files-found: error
          retention-days: 7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Verify lockfile is in sync
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --dry-run

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        shell: pwsh
        run: |
          $env:npm_config_fetch_timeout = "60000"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm audit --omit=dev --audit-level=high
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          throw "Production dependency audit failed after 3 attempts."

      - name: Run source validation
        run: npm run check

      - name: Run all regression tests
        run: npm test

      - name: Run Electron behavior and layout smoke test
        shell: pwsh
        run: |
          & ".\node_modules\.bin\electron.cmd" . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Electron behavior smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Behavior-Evidence
          path: qa-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build portable Windows EXE
        run: npm run build:portable -- --publish never

      - name: Verify portable EXE and record checksum
        shell: pwsh
        run: |
          $exe = Get-Item "dist/ContextHalo-Windows-x64.exe"
          if ($exe.Length -lt 1MB) { throw "Portable EXE is unexpectedly small." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ContextHalo-Windows-x64.exe" | Set-Content -Encoding utf8 "dist/SHA256SUMS.txt"
          Write-Host "Portable EXE SHA-256: $hash"

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Windows-x64-Portable
          path: |
            dist/ContextHalo-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish ContextHalo GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download portable EXE
        uses: actions/download-artifact@v5
        with:
          name: ContextHalo-Windows-x64-Portable
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0-portable.${{ github.run_number }}
          name: ContextHalo Windows Portable Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/ContextHalo-Windows-x64.exe
            release/SHA256SUMS.txt
