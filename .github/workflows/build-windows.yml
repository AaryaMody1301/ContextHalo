name: Build Windows Portable EXE

on:
  push:
    branches: [main, phase-1-complete-fixes]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build standalone Windows x64 EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Verify lockfile is in sync
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --dry-run

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Run source validation
        shell: pwsh
        run: npm run check

      - name: Run tests
        shell: pwsh
        run: npm test --if-present

      - name: Build portable Windows EXE
        shell: pwsh
        run: npm run build:portable -- --publish never

      - name: Verify portable EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -File -Filter "Cheating-Daddy-Windows-x64.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Contents of dist/:"
            Get-ChildItem -Path "dist" -Recurse | Select-Object FullName, Length
            throw "Portable Windows EXE was not produced."
          }
          Write-Host "Portable EXE: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheating-Daddy-Windows-x64-Portable
          path: dist/Cheating-Daddy-Windows-x64.exe
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download portable EXE
        uses: actions/download-artifact@v8
        with:
          name: Cheating-Daddy-Windows-x64-Portable
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0-portable.${{ github.run_number }}
          name: Cheating Daddy Windows Portable Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/Cheating-Daddy-Windows-x64.exe
