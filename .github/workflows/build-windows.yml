name: Build ContextHalo Windows Portable EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contexthalo-windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ContextHalo Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Upload validation source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Validation-Source
          path: |
            src/
            tests/
            scripts/
            preload.js
            package.json
            package-lock.json
            README.md
            AGENTS.md
            LICENSE
            CREDITS.md
          if-no-files-found: error
          retention-days: 7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Verify lockfile is in sync
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --dry-run

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        shell: pwsh
        run: |
          $env:npm_config_fetch_timeout = "60000"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Production dependency audit attempt $attempt of 3"
            npm audit --omit=dev --audit-level=high
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          throw "Production dependency audit failed after 3 attempts."

      - name: Run source validation
        shell: pwsh
        run: npm run check

      - name: Run tests
        shell: pwsh
        run: npm test

      - name: Run Electron renderer smoke test
        shell: pwsh
        run: |
          & ".\node_modules\.bin\electron.cmd" . --ci-smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Electron renderer smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Build portable Windows EXE
        shell: pwsh
        run: npm run build:portable -- --publish never

      - name: Verify portable EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -File -Filter "ContextHalo-Windows-x64.exe" | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Path "dist" -Recurse | Select-Object FullName, Length
            throw "Portable Windows EXE was not produced."
          }
          if ($exe.Length -lt 1MB) { throw "Portable EXE is unexpectedly small." }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContextHalo-Windows-x64-Portable
          path: dist/ContextHalo-Windows-x64.exe
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish ContextHalo GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download portable EXE
        uses: actions/download-artifact@v5
        with:
          name: ContextHalo-Windows-x64-Portable
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0-portable.${{ github.run_number }}
          name: ContextHalo Windows Portable Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/ContextHalo-Windows-x64.exe
