name: Maintain ContextHalo branches and releases

on:
  workflow_run:
    workflows: [Build ContextHalo Windows Portable EXE]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only merged branches and obsolete automated build releases
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contexthalo-repository-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'AaryaMody1301/ContextHalo' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate retention rules
        run: node --test tests/repository-maintenance.test.js
      - name: Prune merged branches and retain recent build releases
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'workflow_run' || inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            node scripts/repository-maintenance.js --apply
          else
            node scripts/repository-maintenance.js --dry-run
          fi
      - name: Upload before and after inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ContextHalo-Repository-Maintenance
          path: qa-results/repository-maintenance.json
          if-no-files-found: error
          retention-days: 30
