name: Apply screen smoke final fix

on:
  push:
    branches:
      - fix/gemini-screen-reliability
    paths:
      - .github/workflows/apply-screen-smoke-final-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/gemini-screen-reliability
          fetch-depth: 0

      - name: Apply repair
        run: node .github/repair-data/screen-smoke-final-fix.cjs

      - name: Validate source syntax
        run: npm run check

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Remove one-time repair files and commit
        shell: bash
        run: |
          git rm .github/workflows/apply-screen-smoke-final-fix.yml
          git rm .github/repair-data/screen-smoke-final-fix.cjs
          git add scripts/renderer-behavior-smoke.js src/components/views/AssistantView.js tests/gemini-screen-reliability.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remove competing screen and smoke deadlines"
          git push origin HEAD:fix/gemini-screen-reliability
